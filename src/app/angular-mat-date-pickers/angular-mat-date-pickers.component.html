<style>
  .form-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 20px;
    width: 100%;
  }

  mat-form-field {
    width: 100%;
  }

  .form-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    width: 100%;
  }

  button {
    width: 48%;
  }
</style>


<form [formGroup]="angularMatDatePicker">
  <div class="form-row">
    <div class="col">
      <mat-form-field>
        <mat-label>Choose from date</mat-label>
        <input matInput [matDatepicker]="fromdate" formControlName="formDate" [matDatepickerFilter]="fromDate">
        <mat-datepicker-toggle matIconSuffix [for]="fromdate"></mat-datepicker-toggle>
        <mat-datepicker #fromdate></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col">
      <mat-form-field>
        <mat-label>Choose to date</mat-label>
        <input matInput [matDatepicker]="todate" formControlName="toDate" [matDatepickerFilter]="toDate">
        <mat-datepicker-toggle matIconSuffix [for]="todate"></mat-datepicker-toggle>
        <mat-datepicker touchUi #todate></mat-datepicker>
      </mat-form-field>
    </div>
  </div>

  <div class="form-actions">
    <button mat-flat-button color="primary">Submit</button>
    <button mat-flat-button color="warn" type="reset" (click)="clear()">Clear</button>
  </div>
</form>
