<style>
    .custom-day {
        text-align: center;
        padding: 0.185rem 0.25rem;
        border-radius: 100%;
        display: inline-block;
        width: 2rem;
    }

    .custom-day:hover,
    .custom-day.focused {
        background-color: #000000;
        color: white;
    }

    .weekend {
        background-color: #eaeaea;
        border-radius: 100%;
        color: rgb(0, 0, 0);
    }

    .hidden {
        display: none;
    }

    .white-icon {
        color: rgb(255, 255, 255);
    }

    /* Highlight the current date */
    .current-day {
        background-color: #007bff !important;
        color: white !important;
        font-weight: bold;
    }
</style>

<form class="row row-cols-sm-auto" [formGroup]="ngDatePickerFrom">
    <div class="col-12">
        <div class="input-group">
            <input class="form-control" placeholder="yyyy-mm-dd" name="dp" [placement]="placement"
                [displayMonths]="displayMonths" [dayTemplate]="customDay" [navigation]="navigation"
                [outsideDays]="outsideDays" [showWeekNumbers]="showWeekNumbers" ngbDatepicker #d="ngbDatepicker"
                formControlName="datePicker" />
            <button class="btn btn-danger bi bi-calendar3" (click)="d.toggle()" type="button">
                <mat-icon class="white-icon">event</mat-icon>
            </button>
        </div>
    </div>
</form>

<div>
    <br>
    <div class="row">
        <div class="col-6">
            <button class="w-100 btn btn-primary">Submit</button>
        </div>
        <div class="col-6">
            <button class="w-100 btn btn-danger" (click)="clear()">Clear</button>
        </div>
    </div>
</div>

<ng-template #customDay let-date let-currentMonth="currentMonth" let-selected="selected" let-disabled="disabled"
    let-focused="focused">
    <span class="custom-day"
        [class.weekend]="isWeekend(date)"
        [class.focused]="focused"
        [class.hidden]="date.month !== currentMonth"
        [class.text-muted]="disabled"
        [class.current-day]="isToday(date)">
        {{ date.day }}
    </span>
</ng-template>
