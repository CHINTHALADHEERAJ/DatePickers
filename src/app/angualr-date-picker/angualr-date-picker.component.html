 
<div class="date-picker-container">
  <h1 class="date-picker-header">
    Angular Material Date Picker Example
  </h1>
  <form [formGroup]="angularMatDatePicker">
    <div class="form-row">
      <div class="col">
        <mat-form-field>
          <mat-label>Choose from date</mat-label>
          <input matInput [matDatepicker]="fromdate" formControlName="formDate">
          <mat-datepicker-toggle matIconSuffix [for]="fromdate"></mat-datepicker-toggle>
          <mat-datepicker #fromdate></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field>
          <mat-label>Choose to date</mat-label>
          <input matInput [matDatepicker]="todate" formControlName="toDate">
          <mat-datepicker-toggle matIconSuffix [for]="todate"></mat-datepicker-toggle>
          <mat-datepicker touchUi #todate></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <div class="form-actions">
      <button mat-flat-button color="primary">Submit</button>
      <button mat-flat-button color="warn" type="reset" (click)="clear()">Clear</button>
    </div>
  </form>
</div>
